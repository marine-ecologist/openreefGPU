name: Publish RunPod worker image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-gpu.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the version contract
        id: versions
        shell: bash
        run: |
          GPU_VERSION=$(node -p "require('./versions.json').openreefGPU.version")
          printf 'gpu_version=%s\n' "$GPU_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the RunPod worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openreef-gpu:${{ steps.versions.outputs.gpu_version }}
            ghcr.io/${{ github.repository_owner }}/openreef-gpu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
