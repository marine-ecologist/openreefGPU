name: Publish RunPod worker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional separate image tag (does not update latest)
        type: string
        default: ""
      volume_overlay:
        description: Reuse the deployed volume image for worker-only changes
        type: boolean
        default: false
      reuse_native_image:
        description: Reuse the verified native worker image for a core/adapter-only release
        type: boolean
        default: false
  push:
    tags:
      - 'v*-gpu.*'
  workflow_run:
    workflows: ['Validate openreefGPU']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Select a validated version change or an explicit build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != workflow_run ] || ! git diff --quiet HEAD^ HEAD -- versions.json; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}

      - name: Read the version contract
        id: versions
        shell: bash
        run: |
          GPU_VERSION=$(node -p "require('./versions.json').openreefGPU.version")
          printf 'gpu_version=%s\n' "$GPU_VERSION" >> "$GITHUB_OUTPUT"

      - name: Select image tags
        id: image
        env:
          CUSTOM_TAG: ${{ inputs.image_tag }}
          GPU_VERSION: ${{ steps.versions.outputs.gpu_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            [[ "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 1
            echo "tags=ghcr.io/$OWNER/openreef-gpu:$CUSTOM_TAG" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<END_TAGS'
              echo "ghcr.io/$OWNER/openreef-gpu:$GPU_VERSION"
              echo "ghcr.io/$OWNER/openreef-gpu:latest"
              echo 'END_TAGS'
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test direct volume inputs before publishing
        run: |
          node scripts/fetch-pinned-openreef.mjs .upstream/openreef
          git -C .upstream/openreef apply --check ../../worker/patches/openreef-stereo.patch
          git -C .upstream/openreef apply ../../worker/patches/openreef-stereo.patch
          python -m pip install -r worker/requirements-dev.txt
          python -m pip install --no-deps .upstream/openreef
          ruff check worker tests/test_volume_worker.py tests/test_joint_worker.py tests/test_stereo_video.py
          pytest -q tests/test_joint_worker.py tests/test_volume_worker.py tests/test_worker.py tests/test_stereo_worker.py tests/test_stereo_video.py tests/test_full_project.py tests/test_diagnostics.py

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the RunPod worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.volume_overlay && 'worker/Dockerfile.volume' || inputs.reuse_native_image && 'worker/Dockerfile.release' || 'worker/Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
